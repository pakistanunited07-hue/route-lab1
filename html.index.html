<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route Lab</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.7) !important;
            color: #94a3b8 !important;
            font-size: 10px !important;
            backdrop-filter: blur(4px);
        }
        .leaflet-control-attribution a {
            color: #38bdf8 !important;
        }
        /* Custom pulse animation for live marker */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.6); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .live-pulse {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.5);
            left: -10px;
            top: -10px;
            animation: pulse-ring 2s infinite ease-out;
            pointer-events: none;
        }
        /* Custom scrollbar for modals/drawers */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="relative flex flex-col h-screen w-screen overflow-hidden">

    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <!-- TOP HEADER / BRANDING -->
    <header class="absolute top-4 left-4 right-4 z-10 flex items-center justify-between pointer-events-none">
        <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/60 rounded-2xl px-4 py-2.5 shadow-2xl flex items-center gap-2.5 pointer-events-auto">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/30">
                <i class="fa-solid fa-route text-white text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-slate-100">Route Lab</h1>
                <p id="connection-status" class="text-[10px] text-sky-400 font-medium flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span> Ready to Track
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <button onclick="openHistoryModal()" class="w-11 h-11 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800/80 transition shadow-2xl active:scale-95" title="Saved Routes">
                <i class="fa-solid fa-clock-rotate-left text-sm"></i>
            </button>
            <button onclick="centerOnUser()" class="w-11 h-11 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-slate-700/60 flex items-center justify-center text-sky-400 hover:text-sky-300 hover:bg-slate-800/80 transition shadow-2xl active:scale-95" title="Center Map">
                <i class="fa-solid fa-crosshairs text-sm"></i>
            </button>
        </div>
    </header>

    <!-- LIVE TELEMETRY HUD (Appears when tracking active) -->
    <div id="telemetry-hud" class="absolute top-20 left-4 right-4 z-10 grid grid-cols-3 gap-2 pointer-events-none transition-all duration-300 transform -translate-y-2 opacity-0 hidden">
        <!-- Distance Card -->
        <div class="bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3 shadow-xl pointer-events-auto flex flex-col justify-between">
            <span class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider flex items-center gap-1">
                <i class="fa-solid fa-road text-sky-400"></i> Dist
            </span>
            <div class="mt-1">
                <span id="hud-distance" class="text-lg font-black text-white tracking-tight">0.00</span>
                <span id="hud-distance-unit" class="text-[10px] text-slate-400 font-medium ml-0.5">km</span>
            </div>
        </div>

        <!-- Speed Card -->
        <div class="bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3 shadow-xl pointer-events-auto flex flex-col justify-between">
            <span class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider flex items-center gap-1">
                <i class="fa-solid fa-gauge-high text-emerald-400"></i> Speed
            </span>
            <div class="mt-1">
                <span id="hud-speed" class="text-lg font-black text-white tracking-tight">0.0</span>
                <span class="text-[10px] text-slate-400 font-medium ml-0.5">km/h</span>
            </div>
        </div>

        <!-- Accuracy Card -->
        <div class="bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3 shadow-xl pointer-events-auto flex flex-col justify-between">
            <span class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider flex items-center gap-1">
                <i class="fa-solid fa-bullseye text-indigo-400"></i> GPS Acc
            </span>
            <div class="mt-1">
                <span id="hud-accuracy" class="text-lg font-black text-white tracking-tight">--</span>
                <span class="text-[10px] text-slate-400 font-medium ml-0.5">m</span>
            </div>
        </div>
    </div>

    <!-- BOTTOM CONTROLS & GPS METRICS -->
    <div class="absolute bottom-6 left-4 right-4 z-10 pointer-events-none flex flex-col gap-3">
        
        <!-- Live GPS Diagnostic Banner -->
        <div class="bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3.5 shadow-2xl pointer-events-auto flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
                <div id="gps-status-dot" class="w-3 h-3 rounded-full bg-slate-500 shrink-0"></div>
                <div class="text-xs truncate">
                    <div class="font-semibold text-slate-200 truncate flex items-center gap-2">
                        <span id="coord-lat">Lat: --</span>
                        <span class="text-slate-600">|</span>
                        <span id="coord-lng">Lng: --</span>
                    </div>
                    <div class="text-[11px] text-slate-400 font-medium mt-0.5 flex items-center gap-2">
                        <span>Accuracy: <strong id="val-accuracy" class="text-sky-400">-- m</strong></span>
                        <span>•</span>
                        <span>Timer: <strong id="val-timer" class="text-emerald-400">00:00:00</strong></span>
                    </div>
                </div>
            </div>
            <button onclick="toggleMapType()" class="px-2.5 py-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium border border-slate-700 transition shrink-0 flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-layer-group text-sky-400"></i> <span id="map-type-label">Street</span>
            </button>
        </div>

        <!-- Action Control Buttons -->
        <div class="flex items-center gap-3 pointer-events-auto">
            <!-- Start / Pause / Resume Button -->
            <button id="btn-main-action" onclick="handleMainAction()" class="flex-1 h-14 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-xl shadow-sky-500/25 flex items-center justify-center gap-2 text-base transition active:scale-[0.98]">
                <i class="fa-solid fa-play text-sm"></i> Start Tracking
            </button>
            
            <!-- Stop / Save Button (Hidden initially) -->
            <button id="btn-stop-action" onclick="stopTracking()" class="w-14 h-14 bg-rose-600/90 hover:bg-rose-500 text-white rounded-2xl shadow-xl shadow-rose-600/25 flex items-center justify-center text-lg transition active:scale-[0.98] hidden" title="Stop & Save">
                <i class="fa-solid fa-stop"></i>
            </button>
        </div>
    </div>

    <!-- SAVED SESSIONS MODAL -->
    <div id="history-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4 hidden transition-opacity opacity-0">
        <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-md max-h-[85vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="history-modal-content">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <h3 class="font-bold text-slate-100 text-base">Recorded Routes</h3>
                </div>
                <button onclick="closeHistoryModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Modal Body / List -->
            <div id="history-list" class="p-4 overflow-y-auto flex-1 space-y-3">
                <!-- Dynamically populated -->
            </div>
            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex justify-between items-center text-xs text-slate-400">
                <span id="history-count">0 routes saved locally</span>
                <button onclick="clearAllHistory()" class="text-rose-400 hover:text-rose-300 font-medium transition">Clear All</button>
            </div>
        </div>
    </div>

    <!-- ROUTE SUMMARY MODAL (Shown after stopping) -->
    <div id="summary-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl shadow-2xl p-6 flex flex-col items-center text-center">
            <div class="w-16 h-16 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mb-4 shadow-xl shadow-emerald-500/10">
                <i class="fa-solid fa-flag-checkered"></i>
            </div>
            <h3 class="text-xl font-black text-slate-100">Route Completed!</h3>
            <p class="text-xs text-slate-400 mt-1">Here is a summary of your tracking session.</p>

            <div class="grid grid-cols-2 gap-3 w-full my-6">
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-3 text-left">
                    <span class="text-[10px] uppercase font-semibold text-slate-400">Distance</span>
                    <div class="text-lg font-black text-white mt-1"><span id="summary-distance">0.00</span> <span class="text-xs text-slate-400 font-normal">km</span></div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-3 text-left">
                    <span class="text-[10px] uppercase font-semibold text-slate-400">Duration</span>
                    <div class="text-lg font-black text-white mt-1" id="summary-time">00:00</div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-3 text-left">
                    <span class="text-[10px] uppercase font-semibold text-slate-400">Avg Speed</span>
                    <div class="text-lg font-black text-white mt-1"><span id="summary-speed">0.0</span> <span class="text-xs text-slate-400 font-normal">km/h</span></div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-3 text-left">
                    <span class="text-[10px] uppercase font-semibold text-slate-400">Points Logged</span>
                    <div class="text-lg font-black text-white mt-1" id="summary-points">0</div>
                </div>
            </div>

            <div class="w-full space-y-2">
                <button onclick="saveCurrentRoute()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded-2xl shadow-lg shadow-emerald-500/20 transition active:scale-[0.98] text-sm">
                    Save Route
                </button>
                <button onclick="discardCurrentRoute()" class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-2xl transition active:scale-[0.98] text-sm">
                    Discard
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // --- State Variables ---
        let map;
        let userMarker = null;
        let accuracyCircle = null;
        let routePolyline = null;
        let watchId = null;

        let trackingState = 'IDLE'; // IDLE, TRACKING, PAUSED
        let routeCoordinates = []; // Array of [lat, lng]
        let totalDistanceMeters = 0;
        let startTime = null;
        let pausedDurationSeconds = 0;
        let pauseStartTime = null;
        let timerInterval = null;
        let lastPosition = null;
        let currentAccuracy = null;
        let currentSpeedKmh = 0;
        let isDarkModeMap = true;

        // Tile layers
        let streetLayerDark, streetLayerLight;

        // --- Initialize Map ---
        function initMap() {
            // Default center (Fallback before GPS fix)
            const defaultLat = 30.3753;
            const defaultLng = 69.3451;

            map = L.map('map', {
                zoomControl: false,
                attributionControl: true
            }).setView([defaultLat, defaultLng], 15);

            // Add custom zoom control to top-right or bottom-right if desired, keeping clean UI
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // OpenStreetMap dark styled via CartoDB Dark Matter for sleek modern mobile aesthetic, or standard OSM
            streetLayerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            });

            streetLayerLight = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            });

            streetLayerDark.addTo(map);

            // Try initial location silently
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        updateUserLocationUI(latitude, longitude, accuracy, true);
                    },
                    (error) => {
                        console.warn("Initial GPS position lookup failed:", error.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        // --- Toggle Map Theme ---
        function toggleMapType() {
            if (isDarkModeMap) {
                map.removeLayer(streetLayerDark);
                streetLayerLight.addTo(map);
                isDarkModeMap = false;
                document.getElementById('map-type-label').innerText = 'Standard';
            } else {
                map.removeLayer(streetLayerLight);
                streetLayerDark.addTo(map);
                isDarkModeMap = true;
                document.getElementById('map-type-label').innerText = 'Street';
            }
        }

        // --- Center Map on User ---
        function centerOnUser() {
            if (lastPosition) {
                map.setView([lastPosition.lat, lastPosition.lng], 17, { animate: true, duration: 0.8 });
            } else if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        updateUserLocationUI(latitude, longitude, accuracy, true);
                        map.setView([latitude, longitude], 17, { animate: true, duration: 0.8 });
                    },
                    (error) => {
                        alert("Unable to retrieve your current location. Please check GPS settings.");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }

        // --- Update User Location UI & Marker ---
        function updateUserLocationUI(lat, lng, accuracy, panMap = false) {
            lastPosition = { lat, lng };
            currentAccuracy = accuracy;

            // Update HUD & Diagnostic texts
            document.getElementById('coord-lat').innerText = `Lat: ${lat.toFixed(5)}`;
            document.getElementById('coord-lng').innerText = `Lng: ${lng.toFixed(5)}`;
            document.getElementById('val-accuracy').innerText = `${Math.round(accuracy)} m`;
            document.getElementById('hud-accuracy').innerText = Math.round(accuracy);

            // Update GPS status dot color based on accuracy
            const dot = document.getElementById('gps-status-dot');
            const connStatus = document.getElementById('connection-status');
            if (accuracy <= 10) {
                dot.className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                connStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> GPS High Accuracy';
            } else if (accuracy <= 30) {
                dot.className = "w-3 h-3 rounded-full bg-amber-400 shadow-lg shadow-amber-400/50";
                connStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> GPS Moderate';
            } else {
                dot.className = "w-3 h-3 rounded-full bg-rose-500 shadow-lg shadow-rose-500/50";
                connStatus.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span> GPS Weak';
            }

            // Create or update marker with pulse
            const customIcon = L.divIcon({
                className: 'custom-user-marker',
                html: `<div style="position:relative; width:16px; height:16px; background:#38bdf8; border:3px solid #ffffff; border-radius:50%; box-shadow: 0 0 10px rgba(56,189,248,0.8);"><div class="live-pulse"></div></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            if (!userMarker) {
                userMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
                accuracyCircle = L.circle([lat, lng], {
                    radius: accuracy,
                    color: '#38bdf8',
                    fillColor: '#38bdf8',
                    fillOpacity: 0.12,
                    weight: 1
                }).addTo(map);
            } else {
                userMarker.setLatLng([lat, lng]);
                accuracyCircle.setLatLng([lat, lng]);
                accuracyCircle.setRadius(accuracy);
            }

            if (panMap) {
                map.setView([lat, lng], map.getZoom() > 15 ? map.getZoom() : 17);
            }
        }

        // --- Main Action Button Handler (Start / Pause / Resume) ---
        function handleMainAction() {
            if (trackingState === 'IDLE') {
                startTracking();
            } else if (trackingState === 'TRACKING') {
                pauseTracking();
            } else if (trackingState === 'PAUSED') {
                resumeTracking();
            }
        }

        // --- Start Tracking ---
        function startTracking() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported on this device.");
                return;
            }

            trackingState = 'TRACKING';
            routeCoordinates = [];
            totalDistanceMeters = 0;
            startTime = new Date();
            pausedDurationSeconds = 0;

            // Update UI buttons
            const mainBtn = document.getElementById('btn-main-action');
            mainBtn.innerHTML = '<i class="fa-solid fa-pause text-sm"></i> Pause Tracking';
            mainBtn.className = "flex-1 h-14 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold rounded-2xl shadow-xl shadow-amber-500/25 flex items-center justify-center gap-2 text-base transition active:scale-[0.98]";

            document.getElementById('btn-stop-action').classList.remove('hidden');
            document.getElementById('telemetry-hud').classList.remove('hidden', '-translate-y-2', 'opacity-0');

            // Initialize polyline on map
            if (routePolyline) {
                map.removeLayer(routePolyline);
            }
            routePolyline = L.polyline([], {
                color: '#38bdf8',
                weight: 5,
                opacity: 0.85,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            // Start Timer
            startTimer();

            // Start Geolocation Watch
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    if (trackingState !== 'TRACKING') return;

                    const { latitude, longitude, accuracy, speed } = position.coords;
                    updateUserLocationUI(latitude, longitude, accuracy, true);

                    // Calculate distance if previous point exists
                    const newLatLng = [latitude, longitude];
                    if (routeCoordinates.length > 0) {
                        const lastPt = routeCoordinates[routeCoordinates.length - 1];
                        const dist = calculateDistanceMeters(lastPt[0], lastPt[1], latitude, longitude);
                        // Filter out minor GPS jitters (< 2 meters jump unless moving fast)
                        if (dist > 2.5) {
                            totalDistanceMeters += dist;
                            routeCoordinates.push(newLatLng);
                            routePolyline.setLatLngs(routeCoordinates);
                        }
                    } else {
                        routeCoordinates.push(newLatLng);
                        routePolyline.setLatLngs(routeCoordinates);
                    }

                    // Update HUD Distance & Speed
                    const km = totalDistanceMeters / 1000;
                    document.getElementById('hud-distance').innerText = km >= 10 ? km.toFixed(1) : km.toFixed(2);
                    
                    // Speed in km/h (use device speed if available, otherwise compute)
                    if (speed !== null && speed >= 0) {
                        currentSpeedKmh = speed * 3.6; // m/s to km/h
                    }
                    document.getElementById('hud-speed').innerText = currentSpeedKmh.toFixed(1);
                },
                (error) => {
                    console.error("GPS Watch error:", error.message);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // --- Pause Tracking ---
        function pauseTracking() {
            trackingState = 'PAUSED';
            pauseStartTime = new Date();
            clearInterval(timerInterval);

            const mainBtn = document.getElementById('btn-main-action');
            mainBtn.innerHTML = '<i class="fa-solid fa-play text-sm"></i> Resume Tracking';
            mainBtn.className = "flex-1 h-14 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded-2xl shadow-xl shadow-emerald-500/25 flex items-center justify-center gap-2 text-base transition active:scale-[0.98]";

            document.getElementById('connection-status').innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Tracking Paused';
        }

        // --- Resume Tracking ---
        function resumeTracking() {
            trackingState = 'TRACKING';
            if (pauseStartTime) {
                pausedDurationSeconds += Math.floor((new Date() - pauseStartTime) / 1000);
                pauseStartTime = null;
            }
            startTimer();

            const mainBtn = document.getElementById('btn-main-action');
            mainBtn.innerHTML = '<i class="fa-solid fa-pause text-sm"></i> Pause Tracking';
            mainBtn.className = "flex-1 h-14 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-bold rounded-2xl shadow-xl shadow-amber-500/25 flex items-center justify-center gap-2 text-base transition active:scale-[0.98]";
        }

        // --- Stop Tracking & Show Summary ---
        let currentCompletedRouteData = null;

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            clearInterval(timerInterval);
            trackingState = 'IDLE';

            // Calculate final stats
